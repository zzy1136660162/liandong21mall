{% extends "layouts/base.html" %}

{% block title %}状态维护{% endblock %}

{% block content %}
<div class="pcoded-main-container">
    <div class="pcoded-wrapper">
        <div class="pcoded-content">
            <div class="pcoded-inner-content">
                <div class="main-body">
                    <div class="page-wrapper">
                        <div class="page-header">
                            <div class="row align-items-end">
                                <div class="col-lg-8">
                                    <div class="page-header-title">
                                        <div class="d-inline">
                                            <h4>状态维护</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="page-body">
                            <div class="card">
                                <div class="card-block">
                                    <div class="row mb-3">
                                        <div class="col-lg-12">
                                            <div class="row">
                                                <div class="col-md-3">
                                                    <select class="form-control" id="status">
                                                        <option value="">全部审核状态</option>
                                                        <option value="0">待审核</option>
                                                        <option value="1">审核通过</option>
                                                        <option value="2">审核拒绝</option>
                                                        <option value="3">已取消</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3">
                                                    <select class="form-control" id="shipStatus">
                                                        <option value="">全部发货状态</option>
                                                        <option value="0">待发货</option>
                                                        <option value="1">已发货</option>
                                                        <option value="2">已签收</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3">
                                                    <button class="btn btn-primary" onclick="loadData()">搜索</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-hover">
                                            <thead>
                                                <tr>
                                                    <th><input type="checkbox" id="checkAll"></th>
                                                    <th>申请单号</th>
                                                    <th>申请人</th>
                                                    <th>商品信息</th>
                                                    <th>审核状态</th>
                                                    <th>发货状态</th>
                                                    <th>物流信息</th>
                                                    <th>申请时间</th>
                                                    <th>操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="statusTable">
                                                <tr>
                                                    <td colspan="9" class="text-center">加载中...</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <nav>
                                        <ul class="pagination" id="pagination"></ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">状态维护</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>审核状态</label>
                            <select class="form-control" id="editStatus">
                                <option value="0">待审核</option>
                                <option value="1">审核通过</option>
                                <option value="2">审核拒绝</option>
                                <option value="3">已取消</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>发货状态</label>
                            <select class="form-control" id="editShipStatus">
                                <option value="0">待发货</option>
                                <option value="1">已发货</option>
                                <option value="2">已签收</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>物流公司</label>
                            <input type="text" class="form-control" id="editShipCompany" placeholder="物流公司">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>物流单号</label>
                            <input type="text" class="form-control" id="editShipNo" placeholder="物流单号">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>审核备注</label>
                    <textarea class="form-control" id="editReviewRemark" rows="2" placeholder="审核备注"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="submitEdit()">保存</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">申请详情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="detailContent">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
<script>
console.log('status.html loaded');
let currentPage = 1;
let pageSize = 10;

const statusMap = {
    0: '<span class="badge badge-warning">待审核</span>',
    1: '<span class="badge badge-success">审核通过</span>',
    2: '<span class="badge badge-danger">审核拒绝</span>',
    3: '<span class="badge badge-secondary">已取消</span>'
};

const shipStatusMap = {
    0: '<span class="badge badge-warning">待发货</span>',
    1: '<span class="badge badge-info">已发货</span>',
    2: '<span class="badge badge-success">已签收</span>'
};

function loadData(page = 1) {
    currentPage = page;
    const status = document.getElementById('status').value;
    const shipStatus = document.getElementById('shipStatus').value;

    let url = `/api/samples/status?page=${page}&page_size=${pageSize}`;
    if (status !== '') {
        url += `&status=${status}`;
    }
    if (shipStatus !== '') {
        url += `&ship_status=${shipStatus}`;
    }

    console.log('Fetching:', url);
    
    fetch(url)
        .then(response => {
            console.log('Response:', response);
            return response.json();
        })
        .then(res => {
            console.log('Data:', res);
            if (res.code === 200) {
                renderTable(res.data.list);
                renderPagination(res.data.total);
            }
        })
        .catch(err => {
            console.error('Error:', err);
        });
}

function renderTable(data) {
    const tbody = document.getElementById('statusTable');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(item => `
        <tr>
            <td><input type="checkbox" class="status-check" value="${item.id}"></td>
            <td>${item.apply_no}</td>
            <td>${item.user_name || '-'}</td>
            <td>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="${item.product_image}" style="width: 40px; height: 40px; object-fit: cover;" onerror="this.src='/static/assets/images/no-image.png'">
                    <span>${item.product_name || '-'}</span>
                </div>
            </td>
            <td>${statusMap[item.status]}</td>
            <td>${shipStatusMap[item.ship_status]}</td>
            <td>
                <div style="max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    ${item.ship_company ? item.ship_company + ' ' + item.ship_no : '-'}
                </div>
            </td>
            <td>${item.created_at || '-'}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="viewDetail(${item.id})">查看</button>
                <button class="btn btn-sm btn-warning" onclick="openEdit(${item.id})">编辑</button>
            </td>
        </tr>
    `).join('');
}

function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    const ul = document.getElementById('pagination');
    let html = '';

    if (currentPage > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage - 1})">上一页</a></li>`;
    }

    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            html += `<li class="page-item active"><a class="page-link" href="javascript:void(0)">${i}</a></li>`;
        } else {
            html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${i})">${i}</a></li>`;
        }
    }

    if (currentPage < totalPages) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage + 1})">下一页</a></li>`;
    }

    ul.innerHTML = html;
}

function openEdit(id) {
    fetch(`/api/samples/apply/${id}`)
        .then(response => response.json())
        .then(res => {
            if (res.code === 200) {
                const item = res.data;
                document.getElementById('editId').value = item.id;
                document.getElementById('editStatus').value = item.status;
                document.getElementById('editShipStatus').value = item.ship_status;
                document.getElementById('editShipCompany').value = item.ship_company || '';
                document.getElementById('editShipNo').value = item.ship_no || '';
                document.getElementById('editReviewRemark').value = item.review_remark || '';
                $('#editModal').modal('show');
            }
        });
}

function submitEdit() {
    const id = document.getElementById('editId').value;
    const data = {
        id: parseInt(id),
        status: parseInt(document.getElementById('editStatus').value),
        ship_status: parseInt(document.getElementById('editShipStatus').value),
        ship_company: document.getElementById('editShipCompany').value,
        ship_no: document.getElementById('editShipNo').value,
        review_remark: document.getElementById('editReviewRemark').value
    };

    fetch('/api/samples/status', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(res => {
        if (res.code === 200) {
            $('#editModal').modal('hide');
            loadData(currentPage);
            alert('保存成功');
        } else {
            alert(res.message || '操作失败');
        }
    });
}

function viewDetail(id) {
    fetch(`/api/samples/apply/${id}`)
        .then(response => response.json())
        .then(res => {
            if (res.code === 200) {
                const item = res.data;
                document.getElementById('detailContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>申请单号：</strong>${item.apply_no}</p>
                            <p><strong>申请人：</strong>${item.user_name || '-'}</p>
                            <p><strong>联系电话：</strong>${item.user_phone || '-'}</p>
                            <p><strong>收货地址：</strong>${item.address || '-'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>商品名称：</strong>${item.product_name || '-'}</p>
                            <p><strong>申请数量：</strong>${item.quantity}</p>
                            <p><strong>审核状态：</strong>${statusMap[item.status]}</p>
                            <p><strong>发货状态：</strong>${shipStatusMap[item.ship_status]}</p>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <p><strong>审核备注：</strong>${item.review_remark || '-'}</p>
                            <p><strong>物流公司：</strong>${item.ship_company || '-'}</p>
                            <p><strong>物流单号：</strong>${item.ship_no || '-'}</p>
                            <p><strong>发货时间：</strong>${item.ship_time || '-'}</p>
                            <p><strong>签收时间：</strong>${item.receive_time || '-'}</p>
                            <p><strong>申请时间：</strong>${item.created_at || '-'}</p>
                        </div>
                    </div>
                `;
                $('#detailModal').modal('show');
            }
        });
}

document.getElementById('checkAll').addEventListener('change', function() {
    const checks = document.querySelectorAll('.status-check');
    checks.forEach(check => check.checked = this.checked);
});

loadData();
</script>
{% endblock javascripts %}
