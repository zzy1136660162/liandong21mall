{% extends "layouts/base.html" %}

{% block title %}申请列表{% endblock %}

{% block content %}
<div class="pcoded-main-container">
    <div class="pcoded-wrapper">
        <div class="pcoded-content">
            <div class="pcoded-inner-content">
                <div class="main-body">
                    <div class="page-wrapper">
                        <div class="page-header">
                            <div class="row align-items-end">
                                <div class="col-lg-8">
                                    <div class="page-header-title">
                                        <div class="d-inline">
                                            <h4>申请列表</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="page-body">
                            <div class="card">
                                <div class="card-block">
                                    <div class="row mb-3">
                                        <div class="col-lg-12">
                                            <div class="row">
                                                <div class="col-md-3">
                                                    <input type="text" class="form-control" id="keyword" placeholder="申请单号">
                                                </div>
                                                <div class="col-md-3">
                                                    <input type="text" class="form-control" id="userName" placeholder="申请人">
                                                </div>
                                                <div class="col-md-3">
                                                    <input type="text" class="form-control" id="productName" placeholder="商品名称">
                                                </div>
                                                <div class="col-md-2">
                                                    <select class="form-control" id="status">
                                                        <option value="">全部状态</option>
                                                        <option value="0">待审核</option>
                                                        <option value="1">审核通过</option>
                                                        <option value="2">审核拒绝</option>
                                                        <option value="3">已取消</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-1">
                                                    <button class="btn btn-primary" onclick="loadData()">搜索</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-lg-12">
                                            <button class="btn btn-success" onclick="exportData()">导出记录</button>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-hover">
                                            <thead>
                                                <tr>
                                                    <th><input type="checkbox" id="checkAll"></th>
                                                    <th>申请单号</th>
                                                    <th>申请人</th>
                                                    <th>联系电话</th>
                                                    <th>商品信息</th>
                                                    <th>数量</th>
                                                    <th>收货地址</th>
                                                    <th>审核状态</th>
                                                    <th>发货状态</th>
                                                    <th>申请时间</th>
                                                    <th>操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="applyTable">
                                                <tr>
                                                    <td colspan="11" class="text-center">加载中...</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <nav>
                                        <ul class="pagination" id="pagination"></ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">申请详情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="detailContent">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block javascripts %}
<script>
let currentPage = 1;
let pageSize = 10;

const statusMap = {
    0: '<span class="badge badge-warning">待审核</span>',
    1: '<span class="badge badge-success">审核通过</span>',
    2: '<span class="badge badge-danger">审核拒绝</span>',
    3: '<span class="badge badge-secondary">已取消</span>'
};

const shipStatusMap = {
    0: '<span class="badge badge-warning">待发货</span>',
    1: '<span class="badge badge-info">已发货</span>',
    2: '<span class="badge badge-success">已签收</span>'
};

function loadData(page = 1) {
    currentPage = page;
    const keyword = document.getElementById('keyword').value;
    const userName = document.getElementById('userName').value;
    const productName = document.getElementById('productName').value;
    const status = document.getElementById('status').value;

    fetch(`/api/samples/apply/list?page=${page}&page_size=${pageSize}&keyword=${keyword}&user_name=${userName}&product_name=${productName}&status=${status}`)
        .then(response => response.json())
        .then(res => {
            if (res.code === 200) {
                renderTable(res.data.list);
                renderPagination(res.data.total);
            }
        });
}

function renderTable(data) {
    const tbody = document.getElementById('applyTable');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(item => `
        <tr>
            <td><input type="checkbox" class="apply-check" value="${item.id}"></td>
            <td>${item.apply_no}</td>
            <td>${item.user_name || '-'}</td>
            <td>${item.user_phone || '-'}</td>
            <td>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="${item.product_image}" style="width: 40px; height: 40px; object-fit: cover;" onerror="this.src='/static/assets/images/no-image.png'">
                    <span>${item.product_name || '-'}</span>
                </div>
            </td>
            <td>${item.quantity}</td>
            <td><div style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.address || '-'}</div></td>
            <td>${statusMap[item.status]}</td>
            <td>${shipStatusMap[item.ship_status]}</td>
            <td>${item.created_at || '-'}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="viewDetail('${item.apply_no}')">查看</button>
            </td>
        </tr>
    `).join('');
}

function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    const ul = document.getElementById('pagination');
    let html = '';

    if (currentPage > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage - 1})">上一页</a></li>`;
    }

    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            html += `<li class="page-item active"><a class="page-link" href="javascript:void(0)">${i}</a></li>`;
        } else {
            html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${i})">${i}</a></li>`;
        }
    }

    if (currentPage < totalPages) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="loadData(${currentPage + 1})">下一页</a></li>`;
    }

    ul.innerHTML = html;
}

function viewDetail(id) {
    console.log('查看申请详情, ID:', id);
    fetch(`/api/samples/${id}`)
        .then(response => {
            console.log('API 响应状态:', response.status);
            if (!response.ok) {
                throw new Error('API 请求失败: ' + response.status);
            }
            return response.json();
        })
        .then(res => {
            console.log('API 返回数据:', res);
            if (res.code === 200) {
                const item = res.data;
                document.getElementById('detailContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>申请单号：</strong>${item.apply_no}</p>
                            <p><strong>申请人：</strong>${item.user_name || '-'}</p>
                            <p><strong>联系电话：</strong>${item.user_phone || '-'}</p>
                            <p><strong>收货地址：</strong>${item.address || '-'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>商品名称：</strong>${item.product_name || '-'}</p>
                            <p><strong>申请数量：</strong>${item.quantity}</p>
                            <p><strong>审核状态：</strong>${statusMap[item.status]}</p>
                            <p><strong>发货状态：</strong>${shipStatusMap[item.ship_status]}</p>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <p><strong>申请备注：</strong>${item.remark || '-'}</p>
                            <p><strong>审核备注：</strong>${item.review_remark || '-'}</p>
                            <p><strong>物流公司：</strong>${item.ship_company || '-'}</p>
                            <p><strong>物流单号：</strong>${item.ship_no || '-'}</p>
                            <p><strong>申请时间：</strong>${item.created_at || '-'}</p>
                        </div>
                    </div>
                `;
                $('#detailModal').modal('show');
            } else {
                console.error('API 返回错误:', res.message);
                alert('获取详情失败: ' + (res.message || '未知错误'));
            }
        })
        .catch(err => {
            console.error('请求出错:', err);
            alert('请求出错: ' + err.message);
        });
}

function exportData() {
    window.location.href = '/api/samples/export';
}

document.getElementById('checkAll').addEventListener('change', function() {
    const checks = document.querySelectorAll('.apply-check');
    checks.forEach(check => check.checked = this.checked);
});

loadData();
</script>
{% endblock javascripts %}
